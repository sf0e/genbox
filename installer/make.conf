# ============================================================================
#  genbox make.conf  --  portable, pre-made, safe for every device
# ============================================================================
#
#  This file is used by Portage (Gentoo's package manager). It tells the
#  system HOW to build packages. You usually do NOT need to change it.
#
#  HOW TO EDIT THIS FILE
#  ---------------------
#  Every setting below has a comment explaining what it does. To change
#  something, delete the "#" at the start of the line and edit the value.
#  Keep the quotes ("...") around values.
#
#  After editing, rebuild affected packages with:
#       emerge --ask --changed-use --update @world
#
#  If you are unsure, DO NOT EDIT. The defaults here are chosen to work on
#  almost all 64-bit (amd64) computers, in virtual machines, and on laptops.
#
# ============================================================================


# ----------------------------------------------------------------------------
#  CFLAGS / CXXFLAGS -- how the compiler optimizes code
# ----------------------------------------------------------------------------
#  -O2     : good optimization, safe everywhere
#  -pipe   : use pipes between compiler stages (saves memory)
#  -march=native would tune for THIS cpu only; we avoid it so packages can be
#  shared between machines. If you build only for one machine and want extra
#  speed, change "-O2 -pipe" below to "-O2 -pipe -march=native".
#
#  IMPORTANT: never add -fomit-frame-pointer, -Os, or odd flags here.
#  They break some packages on some devices.
CFLAGS="-O2 -pipe"
CXXFLAGS="${CFLAGS}"


# ----------------------------------------------------------------------------
#  MAKEOPTS -- how many CPU cores to use while compiling
# ----------------------------------------------------------------------------
#  "-j4" means use 4 parallel jobs. Rule of thumb:
#       MAKEOPTS="-j$(nproc)"          # auto-detect cores (recommended)
#  We use a safe portable default of 4. Increase it if your device is fast,
#  or set it to "-j1" on very old / low-memory machines.
MAKEOPTS="-j4"


# ----------------------------------------------------------------------------
#  ACCEPT_LICENSE -- which software licenses you accept
# ----------------------------------------------------------------------------
#  "*" accepts free and open-source licenses automatically, but still asks
#  about packages with restrictive licenses (like @BINARY-REDISTRIBUTABLE).
#  This is the most convenient choice for a general-purpose desktop/server.
ACCEPT_LICENSE="* -@EULA"


# ----------------------------------------------------------------------------
#  USE flags that apply to EVERY package
# ----------------------------------------------------------------------------
#  USE flags turn optional features on/off globally. These are chosen to be
#  safe and useful on any device. Add your own below if you want.
#
#  genbox-specific (do not remove these):
USE="-openrc -systemd -udev mdev"


# ----------------------------------------------------------------------------
#  CPU_FLAGS_X86 -- CPU instruction set the compiler may use
# ----------------------------------------------------------------------------
#  These are safe defaults for all modern amd64 CPUs. If you want maximum
#  performance on your own machine, run:
#       emerge --ask app-portage/cpuid2cpuflags
#       cpuid2cpuflags
#  and paste the output here.
CPU_FLAGS_X86="mmx mmxext sse sse2"


# ----------------------------------------------------------------------------
#  VIDEO_CARDS -- graphics drivers to build
# ----------------------------------------------------------------------------
#  Only matters for graphical packages. Listing common ones is safe; Portage
#  simply builds the drivers you actually install. Remove lines you never use.
VIDEO_CARDS="amdgpu fbdev intel nouveau radeon radeonsi vesa dummy"


# ----------------------------------------------------------------------------
#  INPUT_DEVICES -- input hardware
# ----------------------------------------------------------------------------
INPUT_DEVICES="libinput"


# ----------------------------------------------------------------------------
#  GRUB_PLATFORMS -- which bootloader targets to build
# ----------------------------------------------------------------------------
#  "pc" is the old BIOS boot method; "efi-64" is modern UEFI. genbox needs
#  both so the same install medium boots on any amd64 machine.
GRUB_PLATFORMS="pc efi-64"


# ----------------------------------------------------------------------------
#  LANGUAGE / locale
# ----------------------------------------------------------------------------
#  LINGUAS lists languages to build translations for (space separated).
#  L10N is the newer variable used by many packages. Both are safe as-is.
LINGUAS="en"
L10N="en"


# ----------------------------------------------------------------------------
#  EMERGE_DEFAULT_OPTS -- default command-line options for emerge
# ----------------------------------------------------------------------------
#  --ask            : confirm before doing anything (safe!)
#  --quiet-build=y  : don't print every compile line (less noisy)
#  --jobs=N         : build N packages at once (needs lots of RAM)
#  --load-average   : don't start more jobs if the machine is busy
EMERGE_DEFAULT_OPTS="--ask --quiet-build=y --jobs=2 --load-average=8"


# ----------------------------------------------------------------------------
#  FEATURES -- how Portage behaves
# ----------------------------------------------------------------------------
#  sandbox    : catch packages that write outside the build area (safe)
#  userfetch  : download as the normal user, build as root (safer)
#  buildpkg   : save a binary package after building (reinstall-friendly)
#
#  If you are short on disk space, remove "buildpkg".
FEATURES="sandbox userfetch buildpkg"


# ----------------------------------------------------------------------------
#  GENTOO_MIRRORS -- where to download source code from
# ----------------------------------------------------------------------------
#  Leave empty to use the mirrors chosen automatically by the installer.
#  Example: GENTOO_MIRRORS="https://distfiles.gentoo.org"
GENTOO_MIRRORS=""


# ----------------------------------------------------------------------------
#  PORTAGE_NICENESS -- be polite to the rest of the system while building
# ----------------------------------------------------------------------------
#  Higher number = lower priority. 10 keeps the desktop responsive.
PORTAGE_NICENESS="10"


# ----------------------------------------------------------------------------
#  EMERGE_JOBS / BUILD_NICE (advanced, optional)
# ----------------------------------------------------------------------------
#  Uncomment if you want to be even gentler on a laptop:
# BUILD_NICE="10"


# ============================================================================
#  You reached the end. If everything above is left as-is, it works.
#  To rebuild after a change:
#       emerge --ask --changed-use --update @world
# ============================================================================
